# Never use upstream DNS or the container's /etc/hosts — local-only resolver
no-resolv
no-poll
no-hosts

# Never forward codespacex.ir queries upstream
local=/codespacex.ir/

# Wildcard: every *.codespacex.ir → 127.0.0.1
# 127.0.0.1 is the host loopback where nginx (port 80) is exposed
address=/codespacex.ir/127.0.0.1

# No caching needed for static local records
cache-size=0
