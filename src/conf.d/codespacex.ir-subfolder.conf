# Subfolder routing — mirrors the wildcard-subdomain block in codespacex.ir.conf
# but routes by URL path instead of by host:
#
#   codespacex.ir/<container>/...  ->  http://<container>/...
#
# The <container> name (first path segment) is resolved via Docker's DNS
# (127.0.0.11), so any container on the "app" network is reachable with zero
# per-container config, exactly like the subdomain setup. Both run at the same
# time.

server {
    listen 80;

    # The bare domain. Nothing owned it before (it fell through to default.conf),
    # so this takes it over for path-based routing without touching the subdomain
    # wildcard block.
    server_name codespacex.ir;

    charset utf-8;

    error_log /var/log/nginx/codespacex.ir-subfolder-error.log;
    access_log off;

    add_header X-Frame-Options "SAMEORIGIN";
    add_header X-Content-Type-Options "nosniff";

    resolver 127.0.0.11 ipv6=off;

    # Friendly subfolder routes auto-generated from container names, e.g.
    #   sanjeman_sanjup_api -> /sanjup/api      sanjeman_core -> /core
    # (strip the "sanjeman_" prefix, turn "_" into "/"). Regenerate after
    # adding/removing a container with  ./regen-routes.sh
    # Emitted longest-path-first so nested routes are matched before the
    # literal-name catch-all below.
    include /etc/nginx/conf.d/app-routes/*.conf;

    #   /<container>            -> http://<container>/
    #   /<container>/path?x=1   -> http://<container>/path?x=1
    #
    # The container-name prefix is STRIPPED: the downstream app sees paths from
    # its own root (e.g. /login, not /<container>/login).
    location ~ ^/(?<app>[^/]+)(?<rest>/.*)?$ {
        # When the bare name has no trailing path (/container, not /container/...),
        # $rest is empty. With a variable proxy_pass an empty path makes nginx
        # forward the original unstripped URI, so normalize it to "/".
        set $path $rest;
        if ($path = "") {
            set $path "/";
        }

        proxy_http_version 1.1;
        proxy_set_header Host              $http_host;
        proxy_set_header Scheme            $scheme;
        proxy_set_header SERVER_PORT       $server_port;
        proxy_set_header REMOTE_ADDR       $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade           $http_upgrade;
        proxy_set_header Connection        $connection_upgrade;

        proxy_connect_timeout 300;

        proxy_pass http://$app$path$is_args$args;
    }
}
